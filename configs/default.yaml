# ==============================================================================
# HRL 卫星网络路由 — 默认配置文件
# HRL Satellite Network Routing — Default Configuration
#
# 本文件定义了整个系统的所有可调参数。
# 修改配置后无需改代码，直接通过 --config 参数传入即可。
# ==============================================================================

# ── 星座参数 (Constellation) ──
# 选择 StarPerf 内置的 XML 星座定义
constellation:
  name: "Starlink"           # 星座名称: Starlink, Kuiper, OneWeb, Telesat, Boeing
  shell_idx: 0               # 轨道壳层索引 (0-based)
  dT: 60                     # 时隙间隔 (秒), 决定仿真时间粒度

# ── 域划分 (Domain Partitioning) ──
# 将星座分成若干域，每域独立路由 (分层管理的基础)
domain:
  n_domains: 6               # 域数量 (通常 = 轨道数 / 每域轨道数)
  mode: "by_orbit_group"     # 域划分插件名: "by_orbit_group" = 按轨道组均分

# ── 网络资源 (Network Resources) ──
network:
  link_capacity_mbps: 2000.0 # 每条 ISL 链路容量 (Mbps), 约 2 Gbps

# ── 流量生成 (Traffic Generation) ──
# 每个时隙按 Poisson(λ) 生成新流请求
traffic:
  arrival_rate: 5.0          # Poisson λ: 每时隙平均新流数
  bw_range: [10.0, 200.0]   # 流带宽需求范围 (Mbps), 均匀分布
  delay_range: [0.02, 0.10]  # 流时延预算范围 (秒), 20ms-100ms
  duration_range: [5, 30]    # 流持续时间范围 (时隙数)

# ── 路由参数 (Routing) ──
routing:
  lower_mode: "k_path"       # 下层路由模式: "k_path" (K最短路) 或 "hop_by_hop" (逐跳)
  K: 4                       # K 最短路候选数 (仅 k_path 模式使用)
  bw_weight_alpha: 1.0       # 边权中的带宽惩罚系数: w = delay + alpha / remaining_bw

# ── 训练参数 (Training) ──
training:
  seed: 42                   # 随机种子 (可复现性)
  T_episode: 100             # 每回合时隙数

  # Phase 1: 下层预训练 (随机域内子任务)
  pretrain_episodes: 200     # 预训练回合数
  pretrain_subtasks_per_episode: 50  # 每回合生成的子任务数

  # Phase 2: 上层训练 (下层冻结, 完整回合)
  upper_train_episodes: 500  # 上层训练回合数

  # Phase 3: 联合微调 (双方可训练)
  finetune_episodes: 300     # 联合微调回合数

  # SB3 DQN 超参数 (上下层共用, 如需分别配置可扩展)
  # 注: DDQN 无需额外参数, SB3 DQN 内部已支持 Double-Q
  # 注: 若切换为 QRDQN 等, 可能需要添加算法特定参数
  dqn:
    learning_rate: 1.0e-4    # 学习率
    buffer_size: 100000      # 回放缓冲区大小
    batch_size: 64           # 每次梯度更新的批量大小
    gamma: 0.99              # 折扣因子
    tau: 0.005               # 目标网络软更新系数 (τ)
    target_update_interval: 1000  # 目标网络更新间隔 (步)
    exploration_fraction: 0.3     # ε-greedy 探索率衰减比例 (前30%训练)
    exploration_final_eps: 0.05   # 最终探索率
    gradient_steps: 1        # 每次训练调用的梯度步数
    train_freq: 4            # 每 N 步收集后触发一次训练 (SB3 learn模式用)

# ── 评估参数 (Evaluation) ──
evaluation:
  eval_episodes: 20          # 评估回合数
  deterministic: true        # 评估时使用确定性策略 (无探索)
